name: Udgiv Hverdagsblik til GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Hent kildekoden
        uses: actions/checkout@v7

      - name: Klargør Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Installer afhængigheder
        run: npm ci

      - name: Byg appen til repoets Pages-adresse
        env:
          # Offentlige browseroplysninger. Adgangen er begrænset af RLS-politikkerne
          # i supabase/schema.sql; administratornøgler må aldrig ligge her.
          VITE_SUPABASE_URL: https://ipnprbkzphojbsceynol.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlwbnByYmt6cGhvamJzY2V5bm9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3OTcwMTMsImV4cCI6MjEwNjM3MzAxM30.iAAk0rxzymUGpufct0iZ0RcH_AxJ3R3lc9OUN4NsNPw
        run: npm run build -- --base "/${{ github.event.repository.name }}/"

      - name: Klargør GitHub Pages
        uses: actions/configure-pages@v6

      - name: Pak den byggede app
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Udgiv
        id: deployment
        uses: actions/deploy-pages@v5
